name: DB Collector

on:
  workflow_dispatch:
  schedule:
    # Target local sampling times: 06:30 and 16:30 (Europe/Berlin).
    # GitHub cron is UTC and has no timezone support, so we schedule both possible UTC slots
    # across DST and let collector dedup to one sample per route/day.
    # Note: GitHub cron uses UTC.
    # Morning 06:30 local -> 04:30 UTC (summer), 05:30 UTC (winter)
    - cron: "30 4,5 * * *"
    # Afternoon 16:30 local -> 14:30 UTC (summer), 15:30 UTC (winter)
    - cron: "30 14,15 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
      DB_API_KEY: ${{ secrets.DB_API_KEY }}
      CAR_PROVIDER: tomtom
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      TIMEZONE: Europe/Berlin
      DATABASE_PATH: data/train_punctuality.db
      MORNING_SOURCE_EVA: 8000107
      MORNING_TARGET_EVA: 8000290
      MORNING_START: "06:00"
      MORNING_END: "08:00"
      CAR_MORNING_TIME: "06:30"
      AFTERNOON_SOURCE_EVA: 8000290
      AFTERNOON_TARGET_EVA: 8000107
      AFTERNOON_START: "15:30"
      AFTERNOON_END: "17:30"
      CAR_AFTERNOON_TIME: "16:30"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collection
        run: python run_collection.py

      - name: Commit updated DB if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/train_punctuality.db
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
            exit 0
          fi
          git commit -m "chore: update punctuality data"
          git push
