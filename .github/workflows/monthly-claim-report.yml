name: Monthly DB Claim Report

on:
  schedule:
    # Run at both possible UTC hours; the script sends only at 08:00 Europe/Berlin.
    - cron: "0 6,7 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Berichtsmonat YYYY-MM (leer = Vormonat)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: monthly-db-claim-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_PATH: data/train_punctuality.db
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
      REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      CLAIM_SUBSCRIPTION_NAME: ${{ secrets.CLAIM_SUBSCRIPTION_NAME }}
      CLAIM_SUBSCRIPTION_NUMBER: ${{ secrets.CLAIM_SUBSCRIPTION_NUMBER }}
      CLAIM_TRAVELER_NAME: ${{ secrets.CLAIM_TRAVELER_NAME }}
      # Optional: fv2 (default), fv1, nv2, nv1, bc100_2, bc100_1 and the ticket price
      # per validity period for the 25 % cap of the compensation estimate.
      CLAIM_TARIFF: ${{ vars.CLAIM_TARIFF }}
      CLAIM_TICKET_PRICE: ${{ secrets.CLAIM_TICKET_PRICE }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate and send previous month's report
        env:
          # Passed via env (not interpolated into the script) to avoid shell injection;
          # monthly_claim_report.py validates the YYYY-MM format.
          REPORT_MONTH: ${{ inputs.month }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [ "$MANUAL_RUN" = "true" ]; then args+=(--force); fi
          if [ -n "$REPORT_MONTH" ]; then args+=(--month "$REPORT_MONTH"); fi
          python monthly_claim_report.py "${args[@]}"
